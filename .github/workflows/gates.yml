# The gates that can run away from the founder's laptop, on every pull request.
#
# This repo is public, so Actions minutes are free here. The private repos on
# this account cannot start a job at all until the billing on the account is
# settled, which is why this file lives in hermes-v2 and not somewhere else.
#
# What is deliberately NOT here: bin/verify. It asks whether the gateway is
# running, whether a venv is in range and whether an Anthropic credential
# exists, and the honest answer on a runner is no. A gate that is red for being
# in the wrong place gets ignored within a week. The rows below are the ones
# that mean the same thing on any machine.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT `render --check`. That compares the generated files against the
      # founder's own estate.yaml, which is untracked on purpose and will never
      # exist on a runner: the step would be red for a missing config rather
      # than a broken template. Rendering the example config proves every
      # template still parses and every placeholder still resolves, which is
      # the part a stranger's pull request can actually break.
      - name: every template still renders
        run: |
          cp estate.example.yaml estate.yaml
          ./bin/render

      - name: README describes what ships
        run: ./bin/check-readme.py

      # DECISIONS.md, 2026-08-22: every service gets its own verify harness and
      # it runs on every pull request. Here it has no daemon to talk to, so the
      # laptop-only rows SKIP and the rows about the client still run. SKIP is a
      # result. A FAIL from this step is a real fault, on a runner as much as on
      # the laptop.
      - name: consult harness
        run: ./bin/verify-consult

  # crew#182: the phone idea flow's incident tests import the gateway itself,
  # so the runner needs hermes-agent at the exact commit PINNED_VERSION names.
  # The founder's fork holds that commit; upstream carries no tag for it.
  # Runs on the same checkout the laptop runs, not on whatever main is today.
  incident-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read the pinned hermes-agent commit
        id: pin
        run: echo "sha=$(sed -n 2p PINNED_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: chidionyema/hermes-agent
          ref: ${{ steps.pin.outputs.sha }}
          path: hermes-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Editable, because hermes-agent/setup.py refuses to build a wheel on purpose.
      - name: install the pinned agent and the test runner
        run: python -m pip install -q -e ./hermes-agent pytest pytest-asyncio

      # The live-gateway half of CP2 SKIPs here: there is no gateway.pid on a
      # runner, and SKIP is a result. Everything else must pass.
      - name: crew incident tests
        run: python -m pytest -q -rs tests/test_incident_crew182_phone_flow.py tests/test_incident_20260831_the_evolution_lane_never_installed_a_job.py

  # crew#620 CP3: strict shell practice, estate-wide, immediate effect. Every
  # *.sh/*.bash file (or a file whose first line is an sh/bash shebang) must
  # pass shellcheck -S warning, be shfmt -d clean, carry set -euo pipefail
  # (or the documented bin/verify / bin/verify-consult exemption) and a trap.
  # ubuntu-latest ships shellcheck already; shfmt does not, so it is pulled
  # from the pinned GitHub release binary below, retried against a flaky
  # network rather than failing the whole gate on one dropped connection.
  shell-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install shfmt v3.10.0 (pinned, matches what was verified locally)
        run: |
          curl --retry 5 --retry-connrefused -fsSL \
            -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: shell-strict (shellcheck, shfmt, strict mode, trap)
        run: python3 bin/shell-strict .

  # The Otto v1 conformance suite (otto/tests/, crew#768): 255 tests, none
  # of which ran on any pull request before this row existed. `bin/otto-demo`
  # is the one command the founder already runs by hand (R31); this job runs
  # the exact same command a stranger's pull request cannot silently break.
  #
  # Two sections need a real service, not a fake, by their own design intent
  # (otto/tests/cp1/conftest.py, otto/tests/cp4/conftest.py): CP1 spine needs
  # a real `nats-server -js` and a real Postgres; CP4 memory needs a real
  # Postgres with the pgvector extension installed. Both are provisioned
  # below and handed to the suite through the env vars its own conftests
  # already read (`OTTO_NATS_SERVER_BIN`, `OTTO_CP4_TEST_PG_BINDIR`) -- no
  # otto/ source changes needed to wire this in. `otto/tests/cp5/test_live_minimax.py`
  # skips itself cleanly when the estate model router is unreachable, which
  # it always is from a runner.
  otto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install the otto test suite's pinned dependencies
        run: python -m pip install -q -r otto/requirements.txt

      - name: install nats-server v2.11.4 (pinned, matches what CP1 verified locally)
        run: |
          curl --retry 5 --retry-connrefused -fsSL \
            -o /tmp/nats-server.tar.gz \
            https://github.com/nats-io/nats-server/releases/download/v2.11.4/nats-server-v2.11.4-linux-amd64.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install -m 0755 /tmp/nats-server-v2.11.4-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version

      # ubuntu-latest ships PostgreSQL 16 already (service disabled by
      # default, binaries not on PATH); this only adds the pgvector
      # extension files to that same installation. CP1/CP4 start their own
      # disposable cluster with initdb/pg_ctl, so the system service is
      # never started.
      - name: install the pgvector extension for the pre-installed PostgreSQL 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgvector

      - name: otto v1 demo, bin/otto-demo runs every spec section fresh
        env:
          OTTO_NATS_SERVER_BIN: /usr/local/bin/nats-server
          OTTO_CP4_TEST_PG_BINDIR: /usr/lib/postgresql/16/bin
        run: python3 bin/otto-demo
