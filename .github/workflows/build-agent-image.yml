# Builds and pushes the hermes-agent runtime image to GHCR (crew#290/crew#286, the
# Oracle OKE standby). Same proven pattern as idp's build-multiarch.yml (multi-arch,
# cosign-signed, Trivy CRITICAL gate) -- reused, not reinvented (LAW 19/43) -- but
# self-contained here rather than added to idp's shared workflow, since hermes-agent's
# source lives in this repo and a first, unproven build should not carry blast radius
# for every other image idp already builds.
#
# The idp side (platform/hermes-agent/gateway.yaml) references
# ghcr.io/chidionyema/hermes-agent by tag; this workflow is what actually produces it.
name: build-agent-image
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, deploy/k8s/**, hermes-agent/**, .github/workflows/build-agent-image.yml]
  # crew#516 CP4: the image carries the whole estate (config.yaml, skills/, cron/*.jobs), so every
  # merge to main is a new image; the Flux ImagePolicy in idp picks the newest main-<run>-<sha> tag.
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write  # keyless cosign needs the OIDC token; without it every main build died at 'retrieving ID token' (runs 33101787767, 33110843638)
env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/chidionyema/hermes-agent
jobs:
  build:
    # OKE's node pool is VM.Standard.A1.Flex (Ampere, arm64-only -- confirmed via
    # platform/oci/main.tf and prospector-main's own oke overlay comment: "the pool
    # is Ampere A1"). idp's build-multiarch.yml builds both architectures because it
    # serves every estate image, some pulled outside the cluster too; this image has
    # exactly one real consumer (this OKE node pool), so building linux/amd64 as well
    # would be pure CI cost with no real target to run it. Single-arch, no merge job.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: |
            ${{ github.event_name == 'push' && format('type=image,name={0},push=true', env.IMAGE) || 'type=cacheonly' }}
            type=docker,dest=/tmp/scan.tar
          tags: |
            ${{ github.event_name == 'push' && format('{0}:{1}', env.IMAGE, github.sha) || '' }}
            ${{ github.event_name == 'push' && format('{0}:main-{1}-{2}', env.IMAGE, github.run_number, github.sha) || '' }}
          cache-from: type=gha,scope=hermes-agent-arm64
          cache-to: type=gha,mode=max,scope=hermes-agent-arm64
      - name: no CRITICAL vulnerability ships
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: sign the image
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign and verify
        if: github.event_name == 'push'
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.sha }}" --format '{{.Manifest.Digest}}')
          # Sigstore stalled for 5 min on run 33110843638 until the OIDC token expired
          # (crew#516). A bounded attempt and one retry beat a hang that ends in expired_token.
          for attempt in 1 2; do
            timeout 120 cosign sign --yes "${{ env.IMAGE }}@$digest" && break
            [ "$attempt" = 2 ] && { echo "cosign sign failed twice" >&2; exit 1; }
            echo "cosign sign attempt $attempt failed; retrying" >&2; sleep 15
          done
          cosign verify "${{ env.IMAGE }}@$digest" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "signed and verified ${{ env.IMAGE }}@$digest"
