# Builds and pushes the hermes-agent runtime image to GHCR (crew#290/crew#286, the
# Oracle OKE standby). Same proven pattern as idp's build-multiarch.yml (multi-arch,
# cosign-signed, Trivy CRITICAL gate) -- reused, not reinvented (LAW 19/43) -- but
# self-contained here rather than added to idp's shared workflow, since hermes-agent's
# source lives in this repo and a first, unproven build should not carry blast radius
# for every other image idp already builds.
#
# The idp side (platform/hermes-agent/gateway.yaml) references
# ghcr.io/chidionyema/hermes-agent by tag; this workflow is what actually produces it.
name: build-agent-image
on:
  pull_request:
    paths: [Dockerfile, hermes-agent/**, .github/workflows/build-agent-image.yml]
  push:
    branches: [main]
    paths: [Dockerfile, hermes-agent/**, .github/workflows/build-agent-image.yml]
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/chidionyema/hermes-agent
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          arch=${{ matrix.platform }}; arch=${arch#linux/}
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: |
            ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
            type=docker,dest=/tmp/scan.tar
          cache-from: type=gha,scope=hermes-agent-${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=hermes-agent-${{ steps.name.outputs.arch }}
      - name: no CRITICAL vulnerability ships
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"; touch "/tmp/digests/${d#sha256:}"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ steps.name.outputs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
  merge:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: tag
        run: |
          cd /tmp/digests
          digests=""
          for f in *; do
            case "$f" in *[!0-9a-f]*) continue ;; esac
            [ "${#f}" -eq 64 ] || continue
            digests="$digests ${{ env.IMAGE }}@sha256:$f"
          done
          n=$(echo "$digests" | wc -w)
          [ "$n" -eq 2 ] || { echo "expected 2 per-arch digests, found $n"; exit 1; }
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${{ env.IMAGE }}:${{ github.sha }}" $digests
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.sha }}" | grep -E 'Platform:' | sort -u
      - name: sign the manifest list
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.sha }}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${{ env.IMAGE }}@$digest"
          cosign verify "${{ env.IMAGE }}@$digest" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "signed and verified ${{ env.IMAGE }}@$digest"
