model:
  provider: anthropic
  default: claude-sonnet-5
fallback_providers:
  # crew#278 CP3: a fallback on the same provider is not a fallback. OPENAI_API_KEY is in .env.
  - provider: openai
    model: gpt-5.4
agent:
  max_turns: 90
  # Verify-on-stop ON even on Telegram (crew #63 A1): the claim gate joins
  # DONE: claims to the verification ledger, so the agent must actually run
  # verify commands or every DONE it sends is stamped UNVERIFIED.
  verify_on_stop: true
  context_window: 200000
  # Identity does NOT live here. agent.system_prompt only reaches the message
  # path; cron/scheduler.py:5787 builds its own AIAgent without it, so every
  # scheduled message would still come from a nameless agent. SOUL.md is the
  # identity slot both paths read (agent/prompt_builder.py:2323). It is there.
# AGENTS.md is the estate's laws and it is 100,199 chars. A context file is
# truncated head 70% / tail 20%, so a cap of 96000 kept 86,400 chars and cut
# 13,799 out of the middle: measured 2026-08-24, The Architect was running with
# the back half of LAW 34 and the whole of LAWS 35-40 missing, including LAW 35
# ("our golden sacred goal") and LAW 39. The only signal was one WARNING line in
# logs/errors.log that nobody reads.
#
# The cap must clear the file with the ratios applied: max_chars * 0.9 >= size.
# 140000 keeps 126,000 chars, which is the laws plus ~26K of room to grow. Do
# not delete this line to "use the default" -- the dynamic cap is
# context_window * 4 * 0.06 = 48,000 here, which truncates far harder.
context_file_max_chars: 140000
memory:
  memory_enabled: true
  user_profile_enabled: true
skills:
  skill_auto_creation: true
  skill_auto_creation_requires_pr: true
approvals:
  smart_approvals: true
  always_ask:
    - gh pr merge
    - fly deploy
    - fly scale
    - fly machine destroy
    - git push
    - rm -rf
  never_ask:
    - gh issue list
    - gh issue view
    - fly status
    - fly logs
    - git status
    - git diff
command_allowlist:
  - execute_code
_config_version: 38
aux:
  model: claude-sonnet-5
  provider: anthropic
limits:
  max_cost_usd_per_task: 5
  budget_hard_stop: true
sandbox:
  image: python:3.11-slim@sha256:pinned
  mounts:
    - $HERMES_HOME:/estate:ro
    - $HERMES_HOME/skills:/skills:ro
  env_passthrough:
    - GITHUB_TOKEN
    - ANTHROPIC_API_KEY
  network:
    allowlist_file: egress-allowlist.txt
onboarding:
  seen:
    busy_input_prompt: true

# Telegram command menu. hermes re-registers set_my_commands on every start
# (plugins/platforms/telegram/adapter.py:3990); without this block it pushes
# the full 61-command upstream list. Founder, 2026-08-25: "UI has a lot of junk
# from old Hermes". priority_mode: replace => only the list below is registered.
platforms:
  telegram:
    extra:
      command_menu:
        max_commands: 12
        priority_mode: replace
        priority: [sessions, status, steer, queue, stop, approve, deny, new, resume, model, undo, help]

plugins:
  enabled:
    - sovereign
    - guide
