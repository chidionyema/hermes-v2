model:
  provider: anthropic
  default: claude-sonnet-5
fallback_providers:
  - provider: openai
    model: gpt-5.4
agent:
  max_turns: 90
  verify_on_stop: true
  context_window: 200000
context_file_max_chars: 140000
memory:
  memory_enabled: true
  user_profile_enabled: true
skills:
  skill_auto_creation: true
  skill_auto_creation_requires_pr: true
approvals:
  smart_approvals: true
  always_ask:
    - gh pr merge
    - fly deploy
    - fly scale
    - fly machine destroy
    - git push
    - rm -rf
  never_ask:
    - gh issue list
    - gh issue view
    - fly status
    - fly logs
    - git status
    - git diff
command_allowlist:
  - execute_code
_config_version: 38
aux:
  model: claude-sonnet-5
  provider: anthropic
limits:
  max_cost_usd_per_task: 5
  budget_hard_stop: true
sandbox:
  image: python:3.11-slim@sha256:pinned
  mounts:
    - $HERMES_HOME:/estate:ro
    - $HERMES_HOME/skills:/skills:ro
  env_passthrough:
    - GITHUB_TOKEN
    - ANTHROPIC_API_KEY
  network:
    allowlist_file: egress-allowlist.txt
onboarding:
  seen:
    busy_input_prompt: true
platforms:
  telegram:
    extra:
      command_menu:
        max_commands: 12
        priority_mode: replace
        priority:
          - sessions
          - status
          - steer
          - queue
          - stop
          - approve
          - deny
          - new
          - resume
          - model
          - undo
          - help
  a2a:
    enabled: true
    extra:
      port: 9900
plugins:
  enabled:
    - sovereign
    - guide
