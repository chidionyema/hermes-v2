model:
  # crew#568 Phase 5: the primary model is the router's claude lane on a router key, never a
  # vendor key (LAW 34). The router owns the vendor credential and the spend ledger.
  provider: custom
  default: claude
  base_url: https://llm.mumchimp.com/v1
  key_env: LITELLM_API_KEY
fallback_providers:
  # crew#506 CP1 (2026-08-27): one hop, and the router owns the chain behind it. The estate
  # router (idp#409, live 16:20Z) falls minimax -> deepseek itself and refuses an oversized
  # turn before it leaves the estate (max_input_tokens 204800), so a second entry here only
  # re-walked the same lanes a second time after the router had already done so: two owners
  # of one decision, and double the retries on a bad minute. Gemini stays off this list; its
  # prepaid credit is empty (429 on every turn, crew#496).
  - provider: custom
    model: minimax
    base_url: https://llm.mumchimp.com/v1
    key_env: LITELLM_API_KEY
# crew#561 CP3: estate state through the estate MCP, the one query path every session uses
# (idp platform/mcp). The key arrives in the pod's env dir as ESTATE_MCP_KEY (idp
# platform/hermes-agent/mcp-key.yaml); hermes_cli.mcp_config resolves the placeholder before
# connecting. One catalogue, one door; no second copy of the estate inside the agent.
mcp_servers:
  estate:
    url: https://mcp.mumchimp.com/estate/mcp
    headers:
      Authorization: "Bearer ${ESTATE_MCP_KEY}"
agent:
  max_turns: 90
  verify_on_stop: true
  context_window: 200000
context_file_max_chars: 140000
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 5000
  user_char_limit: 2500
  provider: hindsight
skills:
  skill_auto_creation: true
  skill_auto_creation_requires_pr: true
approvals:
  smart_approvals: true
  always_ask:
    - gh pr merge
    - git push
    - rm -rf
  never_ask:
    - gh issue list
    - gh issue view
    - git log
    - git status
    - git diff
command_allowlist:
  - execute_code
_config_version: 38
aux:
  model: claude-fast
  provider: custom
  base_url: https://llm.mumchimp.com/v1
  key_env: LITELLM_API_KEY
limits:
  max_cost_usd_per_task: 5
  budget_hard_stop: true
sandbox:
  image: python:3.11-slim@sha256:pinned
  mounts:
    - $HERMES_HOME:/estate:ro
    - $HERMES_HOME/skills:/skills:ro
  env_passthrough:
    - GITHUB_TOKEN
    - ANTHROPIC_API_KEY
  network:
    allowlist_file: egress-allowlist.txt
onboarding:
  seen:
    busy_input_prompt: true
platforms:
  telegram:
    extra:
      # Founder 2026-08-30 01:2xZ: "my /summary game had a rich interface, now reduced to commands".
      # The card (hermes-agent gateway/summary_card.py) is built from collapsible <details> blocks and
      # tables that only Telegram's rich message endpoint (Bot API 10.1) renders; upstream made that
      # endpoint opt-in with default off (hermes-agent 6183e8ce1b, 2026-06-21) and this file never
      # opted in, so every pin since v2026.8.19 sent the card flat. Pinned by
      # tests/test_incident_founder_summary_card_is_rich.py.
      rich_messages: true
      command_menu:
        max_commands: 12
        priority_mode: replace
        priority:
          - sessions
          - status
          - steer
          - queue
          - stop
          - approve
          - deny
          - new
          - resume
          - model
          - undo
          - help
  a2a:
    enabled: true
    extra:
      port: 9900
plugins:
  enabled:
    - sovereign
    - guide

# crew#496 2026-08-27 14:10Z: the founder's Telegram session reached ~500k tokens
# because compaction fired only at 50% of a 1M window and its summary model
# (claude-sonnet-5 on the OAuth lane) timed out at 120s on every attempt, so
# the window never shrank and every turn ended in a refusal. Cap the trigger
# at 200k tokens so the summary call stays inside what the primary lane accepts;
# the router models were tried as summariser and all sat on empty credit or in
# router cooldown at 14:10Z, so the summariser stays on the main model.
# crew#506 CP3 2026-08-27 (d5ae1960): bounded prompt slices. Measured from state.db
# session_model_usage: the founder's long Telegram session ran 373k-412k input tokens per
# call on the primary lane; a fresh session after the 14:10Z restart runs 43-45k per call,
# which is the fixed overhead (system prompt + tool schemas + memory). The one fallback hop
# is the router's minimax lane, window 204,800 (llm.mumchimp.com /model/info, from
# LiteLLM's model map for MiniMax-M2; the idp config declares no override). A trigger at
# 200k means a turn can reach 200k + 43k before compaction and no fallback can ever take
# it: that is the refusal cascade of crew#496. 150k + 43k = 193k fits the hop with room.
# Decision recorded on crew#506: neither an upstream issue nor a runner swap; the bound is
# a config number tied to the router window, and the test below holds the arithmetic.
compression:
  threshold_tokens: 150000
  context_timeout_seconds: 300
